---
- name: Test Debian-specific fixes
  hosts: all
  tasks:
    - name: "Test OLD command (expected to fail on Debian 12)"
      ansible.builtin.shell: |
        set -o pipefail
        update-alternatives --query java | grep 'Value: ' | grep -o '/.*/jre'
      args:
        executable: /bin/bash
      changed_when: false
      register: old_command_result
      ignore_errors: true

    - name: Display old command result
      ansible.builtin.debug:
        msg: "Old command {{ 'SUCCEEDED' if old_command_result.rc == 0 else 'FAILED' }} with output: '{{ old_command_result.stdout }}'"

    - name: "Test NEW command (should work on Debian 12)"
      ansible.builtin.shell: |
        set -o pipefail
        readlink -f /usr/bin/java | sed 's|/bin/java$||'
      args:
        executable: /bin/bash
      changed_when: false
      register: new_command_result

    - name: Display new command result
      ansible.builtin.debug:
        msg: "New command SUCCEEDED with output: '{{ new_command_result.stdout }}'"

    - name: "Verify iproute package does not exist on Debian"
      ansible.builtin.apt:
        name: iproute
        state: present
      register: iproute_result
      ignore_errors: true
      become: true

    - name: Display iproute result
      ansible.builtin.debug:
        msg: "iproute package {{ 'EXISTS' if iproute_result is succeeded else 'DOES NOT EXIST' }} on Debian (expected: does not exist)"

    - name: "Verify iproute2 package can be installed on Debian"
      ansible.builtin.apt:
        name: iproute2
        state: present
      become: true
